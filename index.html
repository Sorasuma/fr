<style>
/* Палитра сайта: меняется в одном месте */
:root{color-scheme:dark;--bg:#0e1a1d;--panel:#152428;--ink:#ebe4d0;--mute:#8ea6a4;--line:#2d4649;--lnk:#9a8450;--gold:#d6a84e;--m:#6fb3c9;--f:#e39a9a;--btn:#d6a84e;--btnt:#10191b}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.5 "Alegreya Sans",system-ui,sans-serif;padding-bottom:env(safe-area-inset-bottom,0)}

<body>

<script>
const SUPABASE_URL = 'https://tqxuhahvnpytncfqjabg.supabase.co';
const SUPABASE_KEY = 'sb_publishable_AnciNoh96LD8Qe3CXC2AUQ_dETTOser';
const GENERATIONS = 4; // сколько поколений предков показывать у выбранного дракона

const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let dragons = [], byId = {}, sel = null, editId = null, user = null;

async function load() {
  const { data, error } = await sb.from('dragons').select('*').order('name');
  if (error) { $('list').textContent = 'Ошибка загрузки: ' + error.message; return; }
  dragons = data; byId = Object.fromEntries(data.map(d => [d.id, d]));
  renderList(); fillSelects(); renderTree();
  if (storyLoaded && !ed) renderStory();
}

function updateEditBtn() { $('editBtn').classList.toggle('hide', !(user && sel)); }
function openDrawer(id) { closeDrawers(); $(id).classList.remove('hide'); $('scrim').classList.remove('hide'); }
function closeDrawers() { ['listPanel', 'formBox'].forEach(i => $(i).classList.add('hide')); $('scrim').classList.add('hide'); }

function renderList() {
  updateEditBtn();
  const q = $('q').value.trim().toLowerCase();
  const rows = dragons.filter(d => d.name.toLowerCase().includes(q));
  $('list').innerHTML = rows.length ? rows.map(d =>
    `<div class="item ${d.sex} ${d.id === sel ? 'on' : ''}" data-id="${d.id}"><span class="dot"></span>${d.image_url ? `<img class="th" src="${esc(d.image_url)}" alt="" referrerpolicy="no-referrer" loading="lazy" onerror="this.remove()">` : ''}<span class="nm">${esc(d.name)}</span></div>`
  ).join('') : '<div class="sm">Пока никого нет. Войдите и добавьте первого дракона.</div>';
}

function fillSelects() {
  const opt = sex => '<option value="">— неизвестен —</option>' +
    dragons.filter(d => d.sex === sex && d.id !== editId).map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('');
  const s = $('sire').value, m = $('dam').value;
  $('sire').innerHTML = opt('M'); $('dam').innerHTML = opt('F');
  $('sire').value = s; $('dam').value = m;
}

// ---------- Схема родословной: каждый дракон один раз, связи линиями ----------
// Пары стоят рядом, дети — строкой ниже под своей парой. Раскладка не допускает наложений.
const CW = 232, CARD = 208, CH = 64, RH = 140, PAD = 24;
const GAP_FAM = 0.35;        // дополнительный зазор между разными семьями (в карточках)
const MIN_OPEN_ZOOM = 0.45;   // при открытии не мельче этого масштаба (кнопка «Вместить» показывает всё)
const MIN_OPEN_ZOOM_MOBILE = 0.55;
const byName = (a, b) => a.name.localeCompare(b.name, 'ru');
const avg = a => a.reduce((s, v) => s + v, 0) / a.length;

function box(id, l, t) {
  const d = byId[id];
  const pic = d.image_url ? `<img class="pic" src="${esc(d.image_url)}" alt="" referrerpolicy="no-referrer" draggable="false" onerror="this.remove()">` : '';
  return `<div class="box ${d.sex} ${id === sel ? 'sel' : ''}" data-id="${id}" title="${esc(d.name)}" style="left:${l}px;top:${t}px">${pic}
    <div class="txt"><div class="nm">${esc(d.name)}</div>${d.notes ? `<div class="sm">${esc(d.notes)}</div>` : ''}</div></div>`;
}

// isotonic regression: ближайшие к желаемым y, не убывающие (чтобы карточки не налезали)
function pava(d, w) {
  const bl = [];
  d.forEach((v, i) => {
    bl.push({ s: v * w[i], w: w[i], n: 1 });
    while (bl.length > 1) {
      const b = bl[bl.length - 1], a = bl[bl.length - 2];
      if (a.s / a.w <= b.s / b.w) break;
      bl.splice(-2, 2, { s: a.s + b.s, w: a.w + b.w, n: a.n + b.n });
    }
  });
  return bl.flatMap(b => Array(b.n).fill(b.s / b.w));
}

// Раскладка одной связной группы драконов. Возвращает позиции в «карточках» и «поколениях».
function layoutComp(list, P, kids, famKey) {
  const ids = list.map(d => d.id), n = ids.length;

  // 1. Партнёры (оба родителя общего ребёнка) всегда в одном поколении и в одном «блоке»
  const root = {}; ids.forEach(i => root[i] = i);
  const find = i => root[i] === i ? i : (root[i] = find(root[i]));
  const mates = {}; ids.forEach(i => mates[i] = []);
  list.forEach(d => {
    const p = P(d); if (p.length < 2) return;
    root[find(p[0])] = find(p[1]);
    if (!mates[p[0]].includes(p[1])) { mates[p[0]].push(p[1]); mates[p[1]].push(p[0]); }
  });

  // 2. Поколения: ребёнок ровно под родителями
  const lvl = {}; ids.forEach(i => lvl[find(i)] = 0);
  for (let it = 0, ch = true; ch && it <= n; it++) {
    ch = false;
    list.forEach(d => P(d).forEach(p => {
      const a = find(p), b = find(d.id);
      if (a !== b && lvl[b] <= lvl[a] && lvl[a] < n) { lvl[b] = lvl[a] + 1; ch = true; }
    }));
  }
  // предки без родителей опускаются к своим детям, чтобы не тянуть длинные линии
  const hasPar = new Set(list.filter(d => P(d).length).map(d => find(d.id))), low = {};
  list.forEach(d => P(d).forEach(p => { const a = find(p); if (!hasPar.has(a)) low[a] = Math.min(low[a] ?? 1e9, lvl[find(d.id)]); }));
  Object.entries(low).forEach(([a, v]) => { if (v - 1 > lvl[a]) lvl[a] = v - 1; });

  // 3. Блоки: пара (или несколько партнёров цепочкой) двигается как одно целое
  const chain = ms => {
    if (ms.length < 2) return ms;
    const deg = i => mates[i].length, out = [], seen = new Set();
    const start = ms.slice().sort((a, b) => deg(a) - deg(b) || byName(byId[a], byId[b]))[0];
    (function go(i) { seen.add(i); out.push(i); mates[i].slice().sort((a, b) => deg(a) - deg(b)).forEach(j => seen.has(j) || go(j)); })(start);
    return out;
  };
  const grp = {}; ids.forEach(i => (grp[find(i)] ||= []).push(i));
  const unitOf = {}, units = [];
  Object.entries(grp).forEach(([r, ms]) => {
    const u = { lv: lvl[r], m: chain(ms), fam: '', x: 0 };
    u.m.forEach(m => unitOf[m] = u);
    const pm = u.m.find(m => P(byId[m]).length);
    if (pm) u.fam = famKey(byId[pm]);
    units.push(u);
  });
  const L = id => unitOf[id].lv, maxL = Math.max(...units.map(u => u.lv));

  // 4. Порядок в поколениях: обход «сверху вниз», затем сглаживание пересечений
  const ord = new Map(); let c = 0;
  const kidUnits = u => {
    const s = new Set();
    u.m.forEach(m => kids[m].slice().sort((a, b) => famKey(byId[a]) < famKey(byId[b]) ? -1 : famKey(byId[a]) > famKey(byId[b]) ? 1 : byName(byId[a], byId[b])).forEach(k => s.add(unitOf[k])));
    return [...s];
  };
  const visit = u => { if (ord.has(u)) return; ord.set(u, c++); kidUnits(u).forEach(visit); };
  units.filter(u => !u.m.some(m => P(byId[m]).length)).sort((a, b) => a.lv - b.lv || byName(byId[a.m[0]], byId[b.m[0]])).forEach(visit);
  units.forEach(visit);
  const lv = Array.from({ length: maxL + 1 }, () => []);
  units.sort((a, b) => ord.get(a) - ord.get(b)).forEach(u => lv[u.lv].push(u));

  const idx = () => { const ix = {}; lv.forEach(arr => { let k = 0; arr.forEach(u => u.m.forEach(m => ix[m] = k++)); }); return ix; };
  const cross = () => {
    const ix = idx(), E = [];
    list.forEach(d => P(d).forEach(p => { if (L(d.id) === L(p) + 1) E.push([L(p), ix[p], ix[d.id]]); }));
    let t = 0;
    for (let i = 0; i < E.length; i++) for (let j = i + 1; j < E.length; j++)
      if (E[i][0] === E[j][0] && (E[i][1] - E[j][1]) * (E[i][2] - E[j][2]) < 0) t++;
    return t;
  };
  let best = lv.map(a => a.slice()), bc = cross();
  for (let r = 0; r < 8 && bc > 0; r++) {
    const down = r % 2 === 0;
    for (let s = 0; s <= maxL; s++) {
      const l = down ? s : maxL - s, arr = lv[l], ix = idx();
      const key = arr.map(u => {
        const v = [];
        u.m.forEach(m => (down ? P(byId[m]) : kids[m]).forEach(j => { if (L(j) === (down ? l - 1 : l + 1)) v.push(ix[j]); }));
        return v.length ? avg(v) : null;
      });
      const slots = arr.map((_, k) => k).filter(k => key[k] !== null);
      const sorted = slots.slice().sort((a, b) => key[a] - key[b] || (arr[a].fam < arr[b].fam ? -1 : arr[a].fam > arr[b].fam ? 1 : 0) || a - b);
      const na = arr.slice(); slots.forEach((k, i) => na[k] = arr[sorted[i]]); lv[l] = na;
    }
    const c2 = cross(); if (c2 < bc) { bc = c2; best = lv.map(a => a.slice()); }
  }
  best.forEach((a, l) => lv[l] = a);

  // 5. Координаты: родители над детьми, никаких наложений в строке
  const gap = (a, b) => (a.fam && a.fam === b.fam) ? 0 : GAP_FAM;   // братья и сёстры стоят вплотную
  lv.forEach(arr => { let x = 0; arr.forEach((u, k) => { if (k) x += gap(arr[k - 1], u); u.x = x; x += u.m.length; }); });
  const cen = id => unitOf[id].x + unitOf[id].m.indexOf(id) + .5;
  const relax = l => {
    const arr = lv[l], d = [], w = [], cum = []; let x = 0;
    arr.forEach((u, k) => {
      if (k) x += gap(arr[k - 1], u);
      cum.push(x); x += u.m.length;
      const tg = u.m.map(m => {
        const t = [], pa = P(byId[m]);
        if (pa.length) t.push(avg(pa.map(cen)));
        if (kids[m].length) t.push(avg(kids[m].map(cen)));
        return t.length ? avg(t) : null;
      });
      const off = (arr2, rev) => arr2.map((t, i) => t === null ? null : t - .5 - (rev ? arr2.length - 1 - i : i)).filter(v => v !== null);
      const cost = rev => { const o = off(tg, rev); if (!o.length) return 0; const m = avg(o); return o.reduce((s, v) => s + (v - m) ** 2, 0); };
      if (u.m.length > 1 && cost(true) < cost(false) - 1e-6) { u.m.reverse(); tg.reverse(); }
      const o = off(tg, false);
      d.push(o.length ? avg(o) : u.x); w.push(o.length || .05);
    });
    const y = pava(d.map((v, k) => v - cum[k]), w);
    arr.forEach((u, k) => u.x = y[k] + cum[k]);
  };
  for (let r = 0; r < 14; r++) { const o = lv.map((_, i) => i); if (r % 2) o.reverse(); o.forEach(relax); }

  const x0 = Math.min(...units.map(u => u.x)), pos = {};
  units.forEach(u => u.m.forEach((m, i) => pos[m] = { x: u.x - x0 + i, y: u.lv }));
  return { pos, w: Math.max(...units.map(u => u.x - x0 + u.m.length)), h: maxL + 1 };
}

function graph(list) {
  const S = new Set(list.map(d => d.id));
  const P = d => [d.sire_id, d.dam_id].filter(i => S.has(i));
  const famKey = d => (S.has(d.sire_id) ? d.sire_id : '') + '|' + (S.has(d.dam_id) ? d.dam_id : '');
  const kids = {}; list.forEach(d => kids[d.id] = []);
  list.forEach(d => P(d).forEach(p => kids[p].push(d.id)));

  // связные группы: один род — одна группа
  const seen = new Set(), comps = [];
  list.forEach(d => {
    if (seen.has(d.id)) return;
    const comp = [], st = [d.id]; seen.add(d.id);
    while (st.length) {
      const i = st.pop(); comp.push(byId[i]);
      [...P(byId[i]), ...kids[i]].forEach(j => { if (!seen.has(j)) { seen.add(j); st.push(j); } });
    }
    comps.push(comp);
  });
  const lone = comps.filter(c => c.length === 1).map(c => c[0]).sort(byName);
  const lay = comps.filter(c => c.length > 1).sort((a, b) => b.length - a.length).map(c => ({ c, ...layoutComp(c, P, kids, famKey) }));

  // Группы и одиночки укладываются плотными рядами, примерно в форму экрана.
  // Сначала самые высокие, чтобы в каждом ряду стояли группы похожей высоты — без пустых «провалов».
  const GX = 56, GY = 44;
  lay.forEach(l => { l.pw = l.w * CW; l.ph = (l.h - 1) * RH + CH; });
  const aspect = Math.max(1.2, view.clientWidth / Math.max(view.clientHeight, 1) || 2);   // форма области просмотра
  const items = lay.slice().sort((a, b) => b.ph - a.ph || b.pw - a.pw);
  if (lone.length) {   // драконы без родственных связей — один компактный блок, который встаёт в общую упаковку
    const cols = Math.max(2, Math.ceil(Math.sqrt(lone.length * (CH + 16) / CW * 1.6)));
    items.push({ lone: true, cols, pw: Math.min(cols, lone.length) * CW, ph: Math.ceil(lone.length / cols) * (CH + 16) - 16 });
  }
  const shelf = (arr, y0) => {   // arr укладывается рядами; возвращает нижнюю границу
    if (!arr.length) return y0;
    const area = arr.reduce((t, l) => t + (l.pw + GX) * (l.ph + GY), 0);
    const target = Math.max(...arr.map(l => l.pw), Math.sqrt(area * aspect));
    let x = 0, y = y0, rowH = 0;
    arr.forEach(l => {
      if (x && x + l.pw > target) { x = 0; y += rowH + GY; rowH = 0; }
      l.ox = x; l.oy = y; x += l.pw + GX; rowH = Math.max(rowH, l.ph);
    });
    return y + rowH;
  };
  // очень широкие группы (шире «экранной» формы) занимают свой ряд, остальное собирается компактно под ними
  const total = items.reduce((t, l) => t + (l.pw + GX) * (l.ph + GY), 0), wideLim = Math.sqrt(total * aspect);
  const wide = items.filter(l => l.pw > wideLim), rest = items.filter(l => l.pw <= wideLim);
  let H = shelf(wide, 0);
  H = shelf(rest, H ? H + GY : 0);
  const W = items.length ? Math.max(...items.map(l => l.ox + l.pw)) : 0;
  const at = {};
  lay.forEach(l => l.c.forEach(d => at[d.id] = { x: l.ox + l.pos[d.id].x * CW, y: l.oy + l.pos[d.id].y * RH }));
  items.filter(l => l.lone).forEach(l => lone.forEach((d, i) => at[d.id] = { x: l.ox + (i % l.cols) * CW, y: l.oy + Math.floor(i / l.cols) * (CH + 16) }));

  const px = id => at[id].x + PAD, py = id => at[id].y + PAD, cx = id => px(id) + CARD / 2;

  // семьи: пара (или один родитель) → дети
  const fam = new Map();
  list.forEach(d => {
    if (!P(d).length) return;
    const k = famKey(d);
    if (!fam.has(k)) fam.set(k, { ps: k.split('|').filter(Boolean), kids: [] });
    fam.get(k).kids.push(d.id);
  });
  const rows = {};   // соседние семьи в одной строке рисуют шину на разной высоте, чтобы линии не сливались
  fam.forEach(o => { o.jx = avg(o.ps.map(cx)); (rows[py(o.ps[0])] ||= []).push(o); });
  Object.values(rows).forEach(a => a.sort((p, q) => p.jx - q.jx).forEach((o, i) => o.lane = i % 3));

  let path = '', dots = '';
  fam.forEach(o => {
    const ps = o.ps, top = py(ps[0]), bottom = top + CH, bus = bottom + 28 + o.lane * 9;
    let jx = o.jx, jy = bottom;
    if (ps.length > 1) {
      const xa = cx(ps[0]), xb = cx(ps[1]);
      if (Math.abs(xa - xb) <= CW + 1) { jy = top + CH / 2; path += `M${xa} ${jy}H${xb}`; }   // пара рядом: линия между карточками
      else { jy = bottom + 12; path += `M${xa} ${bottom}V${jy}H${xb}V${bottom}`; }            // пара не рядом: линия под карточками
      dots += `<circle cx="${jx}" cy="${jy}" r="4"/>`;
    }
    const xs = o.kids.map(cx).concat(jx);
    path += `M${jx} ${jy}V${bus}M${Math.min(...xs)} ${bus}H${Math.max(...xs)}` + o.kids.map(i => `M${cx(i)} ${bus}V${py(i)}`).join('');
  });
  const TW = W + PAD * 2, TH = H + PAD * 2;
  return { W: TW, H: TH, main: new Set(lay.length ? lay[0].c.map(d => d.id) : []), html: `<svg class="lines" width="${TW}" height="${TH}"><path d="${path}"/>${dots}</svg>` + list.map(d => box(d.id, px(d.id), py(d.id))).join('') };
}

// выбранный дракон: предки, потомки и их партнёры
function relatives(id) {
  const S = new Set(), D = new Set();
  (function up(i, dp) { const d = byId[i]; if (!d || S.has(i) || dp > GENERATIONS) return; S.add(i); up(d.sire_id, dp + 1); up(d.dam_id, dp + 1); })(id, 0);
  (function down(i) {
    if (D.has(i)) return; D.add(i);
    dragons.forEach(k => { if (k.sire_id === i || k.dam_id === i) { S.add(k.id); [k.sire_id, k.dam_id].forEach(p => byId[p] && S.add(p)); down(k.id); } });
  })(id);
  return dragons.filter(d => S.has(d.id));
}

function showAll() { sel = null; renderList(); renderTree(); closeDrawers(); }

function renderTree() {
  const d = byId[sel], list = d ? relatives(sel) : dragons, t = $('tree');
  $('treeTitle').textContent = d ? 'Родословная: ' + d.name : 'Вся родословная';
  if (!list.length) { t.style.width = t.style.height = ''; t.innerHTML = '<div class="sm" style="padding:1.2rem">Пока никого нет.</div>'; fit(); return; }
  const g = graph(list);
  t.style.width = g.W + 'px'; t.style.height = g.H + 'px'; t.innerHTML = g.html; mainIds = g.main; fit();
}

function pick(id) { sel = id; renderList(); renderTree(); closeDrawers(); }

function edit(id) {
  const d = byId[id]; editId = d ? d.id : null;
  fillSelects();
  $('formTitle').textContent = d ? 'Изменить: ' + d.name : 'Новый дракон';
  $('name').value = d?.name ?? ''; $('sex').value = d?.sex ?? 'M';
  $('sire').value = d?.sire_id ?? ''; $('dam').value = d?.dam_id ?? '';
  $('img').value = d?.image_url ?? ''; $('notes').value = d?.notes ?? '';
  $('del').classList.toggle('hide', !d); $('msg').textContent = ''; preview();
}

function preview() {
  const u = $('img').value.trim(), im = $('prev'), m = $('prevMsg');
  m.textContent = '';
  if (!u) { im.classList.add('hide'); return; }
  im.onload = () => { im.classList.remove('hide'); m.textContent = ''; };
  im.onerror = () => { im.classList.add('hide'); m.textContent = 'По этой ссылке картинка не открывается. Нужна прямая ссылка на файл изображения.'; };
  im.src = u;
}
$('img').oninput = preview;

async function save() {
  const name = $('name').value.trim();
  if (!name) { $('msg').textContent = 'Введите имя дракона.'; return; }
  const row = { name, sex: $('sex').value, sire_id: $('sire').value || null, dam_id: $('dam').value || null,
    image_url: $('img').value.trim() || null, notes: $('notes').value.trim() || null };
  const q = editId ? sb.from('dragons').update(row).eq('id', editId).select().single() : sb.from('dragons').insert(row).select().single();
  const { data, error } = await q;
  if (error) { $('msg').textContent = 'Не удалось сохранить: ' + error.message; return; }
  sel = data.id; await load(); edit(null);
  $('msg').textContent = 'Сохранено.';
}

async function remove() {
  if (!editId || !confirm('Удалить дракона? У его детей родитель станет «неизвестен».')) return;
  const { error } = await sb.from('dragons').delete().eq('id', editId);
  if (error) { $('msg').textContent = 'Не удалось удалить: ' + error.message; return; }
  sel = null; editId = null; await load(); edit(null);
}

// ---------- История клана (таблица clan_history в Supabase) ----------
let chs = [], cur = null, ed = false, storyLoaded = false;

async function loadStory() {
  const { data, error } = await sb.from('clan_history').select('*').order('created_at');
  if (error) { $('chap').innerHTML = `<p class="msg">Не удалось загрузить историю: ${esc(error.message)}. Если таблицы clan_history ещё нет, создайте её в Supabase (SQL Editor).</p>`; return; }
  chs = data; if (!chs.some(c => c.id === cur)) cur = chs[0]?.id ?? null;
  renderStory();
}

function renderStory() {
  $('addCh').classList.toggle('hide', !user);
  $('toc').innerHTML = chs.map(c => `<button class="${c.id === cur && ed !== 'new' ? 'on' : ''}" data-ch="${c.id}">${esc(c.title)}</button>`).join('');
  const c = chs.find(x => x.id === cur);
  if (ed && user) {
    const n = ed === 'new';
    $('chap').innerHTML = `<label>Название главы</label><input id="ct" value="${n ? '' : esc(c.title)}">
      <label>Текст (пустая строка — новый абзац). Чтобы сослаться на дракона, напишите @ и начало имени</label><textarea id="cb" rows="18">${n ? '' : esc(c.body)}</textarea><div id="sug" class="sug row hide"></div>
      <div class="row"><button class="pri" id="csave">Сохранить</button><button id="ccancel">Отмена</button>${n ? '' : '<button id="cdel">Удалить главу</button>'}</div><div class="msg" id="cm"></div>`;
  } else if (c) {
    $('chap').innerHTML = `<h2>${esc(c.title)}</h2>` + (c.body.trim() ? c.body.trim().split(/\n{2,}/).map(p => `<p>${mentions(esc(p)).replace(/\n/g, '<br>')}</p>`).join('') : '<p class="sm">Глава пока пустая.</p>')
      + (user ? '<button id="cedit">Изменить главу</button>' : '');
  } else {
    $('chap').innerHTML = `<p class="sm">${user ? 'Историю ещё никто не писал. Нажмите «+ Новая глава».' : 'История клана пока не написана.'}</p>`;
  }
}

// @Имя в тексте становится ссылкой на дракона
function mentions(h) {
  if (!dragons.length) return h;
  const names = dragons.map(d => esc(d.name)).sort((a, b) => b.length - a.length).map(n => n.replace(/[.*+?^${}()|[\]\\]/g, '\\$&'));
  const re = new RegExp('@(' + names.join('|') + ')(?![\\p{L}\\p{N}_])', 'giu');
  return h.replace(re, (m, n) => {
    const d = dragons.find(x => esc(x.name).toLowerCase() === n.toLowerCase());
    return d ? `<a href="#" class="men ${d.sex}" data-m="${d.id}">${esc(d.name)}</a>` : m;
  });
}

function sug() {
  const ta = $('cb'), s = $('sug'); if (!ta || !s) return;
  const m = ta.value.slice(0, ta.selectionStart).match(/@([^\s@]*)$/u);
  if (!m) { s.classList.add('hide'); return; }
  const q = m[1].toLowerCase(), st = d => d.name.toLowerCase().startsWith(q);
  const r = dragons.filter(d => d.name.toLowerCase().includes(q)).sort((a, b) => st(b) - st(a) || byName(a, b)).slice(0, 8);
  s.innerHTML = r.map(d => `<button type="button" class="${d.sex}" data-pm="${d.id}"><span class="dot"></span>${esc(d.name)}</button>`).join('');
  s.classList.toggle('hide', !r.length);
}

async function saveCh() {
  const title = $('ct').value.trim(), body = $('cb').value;
  if (!title) { $('cm').textContent = 'Введите название главы.'; return; }
  const q = ed === 'new' ? sb.from('clan_history').insert({ title, body }).select().single()
                         : sb.from('clan_history').update({ title, body }).eq('id', cur).select().single();
  const { data, error } = await q;
  if (error) { $('cm').textContent = 'Не удалось сохранить: ' + error.message; return; }
  cur = data.id; ed = false; loadStory();
}

async function delCh() {
  if (!confirm('Удалить главу целиком?')) return;
  const { error } = await sb.from('clan_history').delete().eq('id', cur);
  if (error) { $('cm').textContent = 'Не удалось удалить: ' + error.message; return; }
  cur = null; ed = false; loadStory();
}

$('storyView').addEventListener('click', e => {
  const t = e.target, ch = t.closest('[data-ch]');
  const men = t.closest('[data-m]'), pm = t.closest('[data-pm]');
  if (men) { e.preventDefault(); tab('tree'); pick(men.dataset.m); }
  else if (pm) {
    const ta = $('cb'), p = ta.selectionStart, b = ta.value.slice(0, p).replace(/@[^\s@]*$/u, '@' + byId[pm.dataset.pm].name + ' ');
    ta.value = b + ta.value.slice(p); ta.selectionStart = ta.selectionEnd = b.length; ta.focus(); sug();
  }
  else if (t.id === 'cb') sug();
  else if (ch) { cur = ch.dataset.ch; ed = false; renderStory(); }
  else if (t.id === 'addCh') { ed = 'new'; renderStory(); $('ct').focus(); }
  else if (t.id === 'cedit') { ed = cur; renderStory(); }
  else if (t.id === 'csave') saveCh();
  else if (t.id === 'cdel') delCh();
  else if (t.id === 'ccancel') { ed = false; renderStory(); }
});

$('storyView').addEventListener('input', e => { if (e.target.id === 'cb') sug(); });
$('storyView').addEventListener('keyup', e => { if (e.target.id === 'cb') sug(); });

function tab(t) {
  const s = t === 'story';
  document.body.classList.toggle('onstory', s);
  $('treeView').classList.toggle('hide', s); $('storyView').classList.toggle('hide', !s);
  document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  closeDrawers();
  if (!s) fit(); else if (!storyLoaded) { storyLoaded = true; loadStory(); }
}
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => tab(b.dataset.tab));

// ---------- Вход ----------
function renderAuth() {
  $('newBtn').classList.toggle('hide', !user); updateEditBtn(); if (!user) closeDrawers();
  $('auth').innerHTML = user
    ? `<span class="sm">${esc(user.email)}</span><button id="out">Выйти</button>`
    : `<input id="em" type="email" placeholder="Почта" style="width:11rem;margin:0"><input id="pw" type="password" placeholder="Пароль" style="width:9rem;margin:0"><button class="pri" id="in">Войти</button>`;
  if (user) $('out').onclick = () => sb.auth.signOut();
  else $('in').onclick = async () => {
    const { error } = await sb.auth.signInWithPassword({ email: $('em').value, password: $('pw').value });
    if (error) alert('Не удалось войти: ' + error.message);
  };
  if (storyLoaded) { if (!user) ed = false; renderStory(); }
}

document.addEventListener('click', e => {
  const t = e.target.closest('[data-id]'); if (t) pick(t.dataset.id);
});
$('q').oninput = renderList;
$('save').onclick = save; $('del').onclick = remove; $('reset').onclick = () => edit(null);

// Перемещение и масштаб: мышь (перетаскивание, колесо), тач (один палец, щипок), кнопки
let mainIds = new Set(), z = 1, px0 = 0, py0 = 0, moved = false, total = 0, startD = 0, startZ = 1;
const view = $('view'), ptrs = new Map();
const apply = () => { $('tree').style.transform = `translate(${px0}px,${py0}px) scale(${z})`; };
function zoomAt(f, cx, cy) {
  const nz = Math.min(3, Math.max(0.03, z * f));
  px0 = cx - (cx - px0) * nz / z; py0 = cy - (cy - py0) * nz / z; z = nz; apply();
}
function fit(all = false) {
  const t = $('tree'); t.style.transform = 'none';
  const w = t.offsetWidth, h = t.offsetHeight;
  if (!w || !h) return;
  const vw = view.clientWidth, vh = view.clientHeight;
  z = Math.max(0.03, Math.min(1, vw / w, vh / h));
  if (!all) z = Math.max(z, vw >= 700 ? MIN_OPEN_ZOOM : MIN_OPEN_ZOOM_MOBILE);   // слишком мелко не читается — начинаем с читаемого масштаба
  if (w * z <= vw && h * z <= vh) {   // всё помещается — просто по центру
    px0 = (vw - w * z) / 2; py0 = Math.max(10, (vh - h * z) / 2);
  } else {                            // не помещается — показываем самое «населённое» место, а не пустой угол
    const m = 12, Wv = (vw - 2 * m) / z, Hv = (vh - 2 * m) / z;
    const bx = [...t.querySelectorAll('.box')].map(e => ({ x: e.offsetLeft, y: e.offsetTop, s: e.classList.contains('sel'), m: mainIds.has(e.dataset.id) }));
    let fx = 0, fy = 0;
    const clampX = v => Math.max(0, Math.min(v, Math.max(0, w - Wv))), clampY = v => Math.max(0, Math.min(v, Math.max(0, h - Hv)));
    const selB = bx.find(b => b.s);
    if (selB) { fx = clampX(selB.x + CARD / 2 - Wv / 2); fy = clampY(selB.y + CH / 2 - Hv / 2); }   // выбранный дракон — в центре
    else {
      let best = -1;
      const cand = bx.some(b => b.m) ? bx.filter(b => b.m) : bx;   // ищем место в самой большой семье
      cand.forEach(c => {
        const x = clampX(c.x - 16), y = clampY(c.y - 16);
        const n = cand.filter(b => b.x + CARD > x && b.x < x + Wv && b.y + CH > y && b.y < y + Hv).length;
        if (n > best || (n === best && (y < fy || (y === fy && x < fx)))) { best = n; fx = x; fy = y; }
      });
    }
    px0 = m - fx * z; py0 = m - fy * z;
  }
  apply();
}
view.addEventListener('wheel', e => {
  e.preventDefault();
  const r = view.getBoundingClientRect();
  zoomAt(e.deltaY < 0 ? 1.12 : 1 / 1.12, e.clientX - r.left, e.clientY - r.top);
}, { passive: false });
$('ctl').addEventListener('pointerdown', e => e.stopPropagation());
const mid = () => ({ x: view.clientWidth / 2, y: view.clientHeight / 2 });
$('zin').onclick = () => { const m = mid(); zoomAt(1.25, m.x, m.y); };
$('zout').onclick = () => { const m = mid(); zoomAt(1 / 1.25, m.x, m.y); };
$('fit').onclick = () => fit(true);
$('all').onclick = showAll;
document.addEventListener('keydown', e => {
  if (e.key !== 'Escape') return;
  if (!$('scrim').classList.contains('hide')) closeDrawers(); else if (!document.body.classList.contains('onstory')) showAll();
});
$('openList').onclick = () => openDrawer('listPanel');
$('newBtn').onclick = () => { edit(null); openDrawer('formBox'); };
$('editBtn').onclick = () => { edit(sel); openDrawer('formBox'); };
$('scrim').onclick = closeDrawers;
document.querySelectorAll('[data-close]').forEach(b => b.onclick = closeDrawers);
view.addEventListener('pointerdown', e => {
  ptrs.set(e.pointerId, { x: e.clientX, y: e.clientY });
  moved = false; total = 0; view.classList.add('drag');
  if (ptrs.size === 2) { const [a, b] = [...ptrs.values()]; startD = Math.hypot(a.x - b.x, a.y - b.y) || 1; startZ = z; }
});
window.addEventListener('pointermove', e => {
  const p = ptrs.get(e.pointerId); if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (ptrs.size === 1) {
    total += Math.abs(dx) + Math.abs(dy);
    if (total > 5) moved = true;
    px0 += dx; py0 += dy; apply();
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()], r = view.getBoundingClientRect();
    zoomAt(startZ * Math.hypot(a.x - b.x, a.y - b.y) / startD / z, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top);
    moved = true;
  }
});
const endPtr = e => { ptrs.delete(e.pointerId); if (!ptrs.size) view.classList.remove('drag'); };
window.addEventListener('pointerup', endPtr); window.addEventListener('pointercancel', endPtr);
// после перетаскивания клик по карточке не должен выбирать дракона
view.addEventListener('click', e => { if (moved) { e.stopPropagation(); moved = false; } }, true);
window.addEventListener('resize', () => fit());

sb.auth.onAuthStateChange((_e, s) => { user = s?.user ?? null; renderAuth(); });
sb.auth.getSession().then(({ data }) => { user = data.session?.user ?? null; renderAuth(); });
load();
</script>
